<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FCBACB">
    <title>Agendamento | Rafael</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="page-shell form-page">
        <p class="eyebrow">Agenda do Rafael</p>
        <section class="form-card">
            <h1>Agendamento</h1>
            <p class="intro">Preencha os dados do atendimento abaixo.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-actions">
                    <button type="submit">Salvar agendamento</button>
                    <a class="button button-secondary" href="{% url 'agendamentos' %}">
                        Voltar
                    </a>
                </div>
            </form>
        </section>
    </main>

    <script>
    const campoData = document.querySelector('.data-hora');

    campoData.addEventListener('input', function (event) {
        let valor = event.target.value;

        valor = valor.replace(/\D/g, '');

        valor = valor.substring(0, 12);

        if (valor.length > 8) {
            valor = valor.replace(
                /^(\d{2})(\d{2})(\d{4})(\d{2})(\d{0,2})$/,
                '$1/$2/$3 $4:$5'
            );
        } else if (valor.length > 4) {
            valor = valor.replace(
                /^(\d{2})(\d{2})(\d{0,4})$/,
                '$1/$2/$3'
            );
        } else if (valor.length > 2) {
            valor = valor.replace(
                /^(\d{2})(\d{0,2})$/,
                '$1/$2'
            );
        }

        event.target.value = valor;
    });
</script>

</body>
</html>
