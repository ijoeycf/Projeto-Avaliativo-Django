
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FCBACB">
    <title>Nail Designer | Início</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <main class="page-shell">
        <section class="hero-card">
            <div>
                <p class="eyebrow">Agenda do Rafael</p>
                <h1>Seus atendimentos, organizados em um só lugar.</h1>
                <p class="intro">
                    Olá, Rafael! Gerencie seus agendamentos de nail designer
                    com praticidade e deixe mais tempo para cuidar dos clientes.
                </p>
                <a class="button" href="{% url 'agendamentos' %}">
                    Visualizar agendamentos
                </a>
            </div>
            <img class="hero-image"
                 src="{% static 'img/rafaelManicure.png' %}"
                 alt="Rafael, nail designer">
        </section>
    </main>

</body>
</html>
